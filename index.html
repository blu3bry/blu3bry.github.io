<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Title Here</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
    <style type="text/css">
        body {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(12, 1fr);
            min-height: 100vh;
            width: 100%;
            background-color: #121212; /* Fallback color */
            background-image: url('images/pic.jpg'); /* Add your background image here */
            background-size: cover; /* Cover the entire viewport */
            background-position: center; /* Center the image */
        }

        .container {
            grid-row: 2/3;
            justify-self: center;
            align-self: center;
            grid-column: 5/9;
            text-align: center;
            color: white; /* Change text color for better visibility */
        }

        .letter_ct {
            width: 400px;
            height: 300px;
            grid-row: 4/7;
            grid-column: 5/9;
            display: flex;
            align-items: center;
            text-align: center;
            margin: auto;
        }

        .txt {
            grid-row: 9/11;
            grid-column: 5/9;
            text-align: center;
            font-size: large;
            color: white; /* Change text color for better visibility */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>For Charmiing</h1>
    </div>
    <div class="letter_ct">
        <input type="checkbox" id="check" />
        <label for="check">
            <span class="letter main"></span>
            <div class="note">
                <p class="int">Dear love,</p>
                <p>
                    Two long years and counting; that is how long my love for you has been growing and adapting
                    <br />
                    [MESSAGE]
                </p>
                <p class="sign">[greeting],<br />[OWN NAME]</p>
            </div>
            <span class="front"></span>
            <span class="letter flap-bg"></span>
            <span class="letter flap"></span>
            <span class="heart"></span>
        </label>
    </div>
    <div class="txt">
        <h3>click on the letter<3</h3>
    </div>
</body>
</html>
